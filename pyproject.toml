[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-mcp"
version = "0.1.0"
description = "Sovereign local compute over the Model Context Protocol — expose your local NVIDIA GPU (CUDA) + Rust/WASM hands to any MCP client, stdlib-only and air-gappable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "gpu", "cuda", "nvidia", "wasm", "rust", "local-ai", "sovereign", "offline", "ollama"]
authors = [{ name = "Yael Mendez", email = "yael@llm.store" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
]

[project.urls]
Homepage = "https://github.com/MYaelMendez/gpu-mcp"
Repository = "https://github.com/MYaelMendez/gpu-mcp"
"æ.store" = "https://ae.store"

[project.scripts]
gpu-mcp = "gpu_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["gpu_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
